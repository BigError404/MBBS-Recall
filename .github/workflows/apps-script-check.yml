name: Apps Script backend safety checks
on:
  pull_request:
    paths:
      - 'apps-script/**'
      - '.github/workflows/apps-script-check.yml'
  push:
    branches: [apps-script-safe-write-layer]
    paths:
      - 'apps-script/**'
      - '.github/workflows/apps-script-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check embedded browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('apps-script/Index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts, 'No inline client script found'
          Path('/tmp/index-client.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-client.js
      - name: Check Apps Script server JavaScript syntax
        run: node --check < apps-script/Code.gs
      - name: Check Apps Script safety contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('apps-script/Code.gs').read_text()
          checks={
            'master inputs limited to A:I':'MASTER_INPUT_COLS: 9' in s,
            'revision inputs limited to A:D':'REVISION_INPUT_COLS: 4' in s,
            'optimistic edit conflict check':'expectedSnapshot' in s,
            'recoverable archive':'CFG.ARCHIVE' in s and 'archive.getRange(archiveRow, 1, 1, 12).setValues' in s,
            'archive restore path':'function restoreArchived(input)' in s,
            'archive verifies all nine fields before clearing':'sameCells_(verified, rawCurrent)' in s,
            'restore verifies all nine fields':'sameCells_(restoredCheck, original)' in s,
            'archive preserves all nine fields':'...rawCurrent' in s,
            'archive status header repaired':'current[12]' in s and "headers[12]" in s,
            'duplicate restore recovery is content-aware':'sameCells_(existing, original)' in s,
            'archived IDs cannot be reused':'Include archived IDs' in s,
            'date preservation helper':'function dateValue_(' in s,
            'ISO date regex parses yyyy-mm-dd':r'/^(\d{4})-(\d{2})-(\d{2})$/.exec(value)' in s,
            'script lock':'LockService.getScriptLock()' in s,
            'revision result validation accepts dropdown labels':"resultMap = {pass: 'Pass', fail: 'Fail', partial: 'Partial'}" in s and "['Pass','Fail','Partial']" in s,
            'no external web endpoint':'UrlFetchApp.fetch' not in s,
            'web handlers use explicit spreadsheet ID':'getActiveSpreadsheet()' not in s,
            'no API/client secret embedded':'client_secret' not in s.lower(),
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+' '+k)
          assert all(checks.values())
          ui=Path('apps-script/Index.html').read_text()
          ui_checks={
            'archive list reloads after archive':'await Promise.all([refresh(true),loadArchive()])' in ui,
            'archive list reloads after restore':'async function restoreArchivedRow' in ui and 'await Promise.all([refresh(true),loadArchive()])' in ui,
            'refresh can preserve action status':'async function refresh(quiet=false)' in ui,
            'no refresh success message overrides action status':"if(!quiet)msg('Records refreshed from Google Sheets.')" in ui,
          }
          for k,v in ui_checks.items(): print(('PASS' if v else 'FAIL')+' '+k)
          assert all(ui_checks.values())
          PY